/* ══ ДЕЙСТВИЯ ═════════════════════════════════════════════ */

function toast(msg){
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2400);
}

async function copyText(text, msg){
  try {
    await navigator.clipboard.writeText(text);
    toast(msg);
  } catch(e) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast(msg); } catch(_) { toast('Скопировать не удалось'); }
    ta.remove();
  }
}

function remindText(c){
  const st = stats(c), t = timing(c);
  const debt = active().filter(s => stOf(c, s.id) === 'none').map(s => s.name);
  const when = t.phase === 'late'
    ? `Срок вышел ${fmtDY(t.dl)}.`
    : `Просьба сдать до ${fmtDY(t.dl)} (осталось ${days(t.left)}).`;
  return `📌 ${c.title}\n${money(st.per)} с человека. ${when}\n`
    + `Сдали ${st.paid} из ${st.n}, собрано ${money(st.got)} из ${money(st.target)}.\n\n`
    + (debt.length ? `Ещё не сдали (${debt.length}):\n` + debt.map(n => '• ' + n).join('\n')
                   : 'Сдали все, спасибо! 🌷')
    + (c.payee && c.payee.phone
        ? `\n\nПеревод: ${c.payee.phone}`
          + (c.payee.name || c.payee.bank ? ` — ${[c.payee.name, c.payee.bank].filter(Boolean).join(', ')}` : '')
        : '')
    + (c.note ? `\n\n${c.note}` : '');
}

function exportAll(){
  const open = S.collections.filter(c => !c.archived);
  let out = `Отчёт по сборам — ${S.className}\nна ${fmtDY(today())}\n`;
  Object.entries(CATS).forEach(([k, v]) => {
    const list = open.filter(c => c.cat === k);
    if (!list.length) return;
    out += `\n━━ ${v.full.toUpperCase()} ━━\n`;
    list.forEach(c => {
      const st = stats(c);
      out += `\n${c.title} (${OCC_NAME(c.occ)})\n`
           + `  ${money(st.per)} × ${st.n} ${plural(st.n,'человек','человека','человек')} = ${money(st.target)}\n`
           + `  Сбор: ${fmtDY(parseD(c.start))} → ${fmtDY(deadlineOf(c))} (${days(c.days)})\n`
           + `  Собрано ${money(st.got)} · сдали ${st.paid}, ждут ${st.pending}, не сдали ${st.left}\n`;
      const exp = (c.expenses || []).slice().sort((a,b) => (a.date||'').localeCompare(b.date||''));
      if (exp.length){
        out += `  Потрачено ${money(spent(c))}, остаток ${money(balance(c))}:\n`;
        exp.forEach(e => {
          out += `    ${fmtD(parseD(e.date))} — ${e.title}: ${money(e.sum)}${e.who ? ` (${e.who})` : ''}\n`;
        });
      }
    });
  });
  const totOut = allExpenses().reduce((a,e) => a + e.sum, 0);
  const totGot = S.collections.reduce((a,c) => a + stats(c).got, 0);
  out += `\n━━ ИТОГО ━━\n  Собрано ${money(totGot)}\n  Потрачено ${money(totOut)}\n  Остаток в кассе ${money(totGot - totOut)}\n`;
  return out;
}

function setPay(cid, sid, status, sum, date){
  const c = S.collections.find(x => x.id === cid);
  const was = stOf(c, sid);
  // «не сдаёт» меняет число сдающих — в режиме общей суммы доля остальных пересчитается
  if (was !== 'skip' && status === 'skip') c.payers = Math.max(1, payersOf(c) - 1);
  if (was === 'skip' && status !== 'skip') c.payers = Math.min(SEATS, payersOf(c) + 1);

  if (status === 'none') delete c.payments[sid];
  else if (status === 'skip') c.payments[sid] = {status:'skip'};
  else c.payments[sid] = {status, sum: sum ?? perOf(c), date: date || isoD(today())};
  save();
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const a = el.dataset.act;

  // клик по подложке закрывает, клик внутри листа — нет
  if (a === 'close'){
    if (el.classList.contains('backdrop') && e.target.closest('[data-stop]')) return;
    sheet = null; render(); return;
  }

  switch(a){
    case 'view':
      scrollMemo[view] = window.scrollY;
      view = el.dataset.v; render(); break;

    case 'settings':
      scrollMemo[view] = window.scrollY;
      view = 'roster'; render(); break;

    case 'role':
      D.role = el.dataset.v;
      if (D.role === 'parent' && !active().some(s => s.id === D.myId)) D.myId = active()[0]?.id;
      save(); render(); break;

    case 'occ':
      occFilter[el.dataset.cat] = el.dataset.v; render(); break;

    case 'open': {
      const c = S.collections.find(x => x.id === el.dataset.c);
      scrollMemo[view] = window.scrollY;
      view = c.cat; occFilter[c.cat] = c.occ;
      colsOf(c.cat).forEach(x => openRoster[x.id] = false);
      openRoster[c.id] = true;
      render(); break;
    }

    case 'roster':
      openRoster[el.dataset.c] = !openRoster[el.dataset.c];
      scrollMemo[view] = window.scrollY; render(); break;

    case 'exps':
      openExp[el.dataset.c] = !openExp[el.dataset.c];
      scrollMemo[view] = window.scrollY; render(); break;

    case 'newexp':
      sheet = {type:'exp', c:el.dataset.c, e:null};
      scrollMemo[view] = window.scrollY; render(); break;

    case 'editexp':
      sheet = {type:'exp', c:el.dataset.c, e:el.dataset.e};
      scrollMemo[view] = window.scrollY; render(); break;

    case 'saveexp': {
      const c = S.collections.find(x => x.id === sheet.c);
      const g = id => document.getElementById(id);
      const title = g('x-title').value.trim();
      const sum = Math.max(0, +g('x-sum').value || 0);
      if (!title || !sum){ toast('Укажите название и сумму'); return; }
      const data = {title, sum, date:g('x-date').value || isoD(today()), who:g('x-who').value.trim()};
      if (sheet.e) Object.assign(c.expenses.find(x => x.id === sheet.e), data);
      else c.expenses.push({id:'e' + Date.now(), ...data});
      openExp[c.id] = true;
      save(); sheet = null; render(); toast('Трата сохранена'); break;
    }

    case 'delexp': {
      if (!confirm('Удалить эту трату?')) return;
      const c = S.collections.find(x => x.id === sheet.c);
      c.expenses = c.expenses.filter(x => x.id !== sheet.e);
      save(); sheet = null; render(); toast('Трата удалена'); break;
    }

    case 'toggle': {
      const cid = el.dataset.c, sid = el.dataset.s;
      const cur = stOf(S.collections.find(x => x.id === cid), sid);
      setPay(cid, sid, cur === 'paid' ? 'none' : 'paid');
      scrollMemo[view] = window.scrollY; render(); break;
    }

    case 'pay':
      sheet = {type:'pay', c:el.dataset.c, s:el.dataset.s};
      scrollMemo[view] = window.scrollY; render(); break;

    case 'pst': {
      const c = S.collections.find(x => x.id === sheet.c);
      const sum = +document.getElementById('f-sum').value || perOf(c);
      const date = document.getElementById('f-date').value;
      setPay(sheet.c, sheet.s, el.dataset.v, sum, date);
      render(); break;
    }

    case 'savepay': {
      const c = S.collections.find(x => x.id === sheet.c);
      const cur = c.payments[sheet.s];
      if (cur){
        cur.sum = +document.getElementById('f-sum').value || perOf(c);
        cur.date = document.getElementById('f-date').value;
        save();
      }
      sheet = null; render(); toast('Сохранено'); break;
    }


    case 'new':
      sheet = {type:'edit', c:null, cat:el.dataset.cat, occ:el.dataset.occ || null, draft:null};
      scrollMemo[view] = window.scrollY; render(); break;

    case 'nextmonth': {
      const fund = colsOf('fund');
      // следующий месяц после самого позднего заведённого
      const last = fund.map(c => parseD(c.start)).sort((a,b) => b - a)[0] || today();
      const d = new Date(last.getFullYear(), last.getMonth() + 1, 1);
      const occ = MONTH_KEYS[d.getMonth()];
      if (fund.some(c => c.occ === occ && parseD(c.start).getFullYear() === d.getFullYear())){
        toast('Этот месяц уже заведён'); return;
      }
      const amount = fund.length ? perOf(fund[fund.length - 1]) : 500;
      S.collections.push({
        id:'c' + Date.now(), cat:'fund', occ,
        title:`Фонд класса — ${MONTHS_N[d.getMonth()].toLowerCase()} ${d.getFullYear()}`,
        mode:'per', amount, total:amount * active().length, payers:active().length,
        start:isoD(d), days:10, note:'Ежемесячный взнос на текущие нужды класса',
        payments:{}, expenses:[], archived:false,
      });
      occFilter.fund = occ;
      save(); scrollMemo[view] = window.scrollY; render();
      toast(`Открыт ${MONTHS_N[d.getMonth()].toLowerCase()}`); break;
    }

    case 'remindfund': {
      const months = colsOf('fund').filter(c => timing(c).phase !== 'soon');
      const rows = active().map(s => {
        const owe = months.filter(c => stOf(c, s.id) === 'none');
        return {s, owe, sum: owe.reduce((a,x) => a + perOf(x), 0)};
      }).filter(r => r.owe.length);
      const txt = `📌 Фонд класса — напоминание\n`
        + `Взнос ${money(perOf(months[months.length-1]))} в месяц.\n\n`
        + rows.map(r => `• ${r.s.name} — ${r.owe.map(c => OCC_NAME(c.occ).toLowerCase()).join(', ')}: ${money(r.sum)}`).join('\n')
        + `\n\nИтого не сдано: ${money(rows.reduce((a,r) => a + r.sum, 0))}`;
      copyText(txt, 'Список должников скопирован'); break;
    }

    case 'edit':
      sheet = {type:'edit', c:el.dataset.c, draft:null};
      scrollMemo[view] = window.scrollY; render(); break;

    case 'dcat': {
      readDraft();
      sheet.draft.cat = el.dataset.v;
      sheet.draft.occ = OCCASIONS[el.dataset.v][0][0];
      render(); break;
    }
    case 'docc':
      readDraft(); sheet.draft.occ = el.dataset.v; render(); break;

    case 'usedefault':
      readDraft(); sheet.draft.payee = {...S.payee}; render();
      toast('Реквизиты казначея подставлены'); break;

    case 'dmode': {
      readDraft();
      const d = sheet.draft, payers = Math.max(1, +d.payers || 1);
      // переносим введённое значение в другой режим, чтобы сумма не «прыгала»
      if (el.dataset.v === 'total') d.total = Math.max(0, +d.amount || 0) * payers;
      else d.amount = Math.ceil(Math.max(0, +d.total || 0) / payers);
      d.mode = el.dataset.v;
      render(); break;
    }

    case 'savecoll': {
      readDraft();
      const d = sheet.draft;
      if (!d.title.trim()) d.title = OCC_NAME(d.occ);
      d.payers = Math.min(SEATS, Math.max(1, +d.payers || active().length));
      d.amount = Math.max(0, +d.amount || 0);
      d.total  = Math.max(0, +d.total  || 0);
      if (d.mode === 'total') d.amount = Math.ceil(d.total / d.payers);
      else d.total = d.amount * d.payers;
      d.days = Math.max(1, +d.days || S.defDays);
      if (sheet.c){
        Object.assign(S.collections.find(x => x.id === sheet.c), d);
      } else {
        S.collections.push({...d, id:'c' + Date.now(), payments:{}, archived:false});
      }
      save(); const cat = d.cat; sheet = null; view = cat; render();
      toast('Сбор сохранён'); break;
    }

    case 'delcoll': {
      if (!confirm('Удалить сбор вместе с отметками об оплате?')) return;
      S.collections = S.collections.filter(x => x.id !== sheet.c);
      save(); sheet = null; render(); toast('Сбор удалён'); break;
    }

    case 'copypay': {
      const c = S.collections.find(x => x.id === el.dataset.c);
      // в банковское приложение нужен номер без пробелов и дефисов
      copyText((c.payee.phone || '').replace(/[^\d+]/g, ''), 'Номер скопирован'); break;
    }

    case 'remind': {
      const c = S.collections.find(x => x.id === el.dataset.c);
      copyText(remindText(c), 'Напоминание скопировано'); break;
    }

    case 'export':
      copyText(exportAll(), 'Отчёт скопирован'); break;

    case 'clear': {
      const s = S.students.find(x => x.id === el.dataset.s);
      if (!confirm(`Освободить место? «${s.name}» будет удалён из списка.`)) return;
      s.name = '';
      S.collections.forEach(c => delete c.payments[s.id]);
      save(); scrollMemo[view] = window.scrollY; render(); break;
    }

    case 'cloud':
      scrollMemo[view] = window.scrollY; view = 'cloud'; render(); break;

    case 'cloudcreate': {
      const g = id => document.getElementById(id).value.trim();
      const url = normalizeUrl(g('cl-url')), key = g('cl-key'), token = g('cl-token');
      const code = g('cl-code'), admin = g('cl-admin');
      if (!url || !key)     { toast('Нужны Project URL и ключ'); return; }
      if (!token)           { toast('Введите токен установки'); return; }
      if (code.length < 6)  { toast('Код класса — не короче 6 символов'); return; }
      if (admin.length < 8) { toast('Пароль казначея — не короче 8 символов'); return; }
      if (code === admin)   { toast('Код и пароль должны отличаться'); return; }
      D.cloud = {url, key, secret:admin, id:null};
      el.disabled = true; el.textContent = 'Создаём…';
      Cloud.rpc('class_create', {p_state:S, p_code:code, p_admin:admin, p_token:token})
        .then(row => {
          D.cloud.id = row.id;
          D.role = 'treasurer'; saveDevice();
          Cloud.base = clone(S); Cloud.version = 1; Cloud.status = 'ok';
          Cloud.start(); render(); toast('Класс создан');
        })
        .catch(e => { D.cloud = null; saveDevice(); render(); toast(e.message); });
      break;
    }

    case 'cloudjoin': {
      const link = document.getElementById('cl-link').value.trim();
      const secret = document.getElementById('cl-jcode').value.trim();
      const cfg = parseLink(link);
      if (!cfg)    { toast('Ссылку не удалось разобрать'); return; }
      cfg.url = normalizeUrl(cfg.url);
      if (!secret) { toast('Введите код доступа'); return; }
      joinClass({...cfg, secret});
      break;
    }

    case 'setcode': {
      const code = document.getElementById('ac-code').value.trim();
      if (code.length < 6) { toast('Код класса — не короче 6 символов'); return; }
      if (!confirm('Сменить код класса? Все, кто знал старый, потеряют доступ и должны будут ввести новый.')) return;
      el.disabled = true;
      Cloud.rpc('class_set_code', {p_id:D.cloud.id, p_secret:D.cloud.secret, p_new_code:code})
        .then(() => { render(); toast('Код класса изменён — сообщите новый родителям'); })
        .catch(e => { el.disabled = false; toast(e.message); });
      break;
    }

    case 'addadmin': {
      const pw = document.getElementById('ac-admin').value.trim();
      if (pw.length < 8) { toast('Пароль — не короче 8 символов'); return; }
      el.disabled = true;
      Cloud.rpc('class_admin_add', {p_id:D.cloud.id, p_secret:D.cloud.secret, p_new_admin:pw})
        .then(row => { render(); toast(`Казначеев теперь ${row.admins}`); })
        .catch(e => { el.disabled = false; toast(e.message); });
      break;
    }

    case 'resetadmins': {
      if (!confirm('Отозвать доступ у всех казначеев, кроме вас? Ваш пароль продолжит работать.')) return;
      Cloud.rpc('class_admin_reset_others', {p_id:D.cloud.id, p_secret:D.cloud.secret})
        .then(() => toast('Доступ отозван'))
        .catch(e => toast(e.message));
      break;
    }

    case 'copylink':
      copyText(shareLink(), 'Ссылка скопирована'); break;

    case 'pullnow':
      Cloud.tick().then(() => toast('Обновлено')); break;

    case 'unlink':
      if (!confirm('Выйти на этом устройстве? Данные класса останутся на сервере, войти можно снова по коду.')) return;
      D.cloud = null; saveDevice(); clearInterval(Cloud.timer);
      Cloud.base = null; Cloud.version = 0; Cloud.status = 'off';
      render(); break;

    case 'gate-join': {
      const secret = document.getElementById('g-code').value.trim();
      if (!secret) { toast('Введите код доступа'); return; }
      el.disabled = true; el.textContent = 'Проверяем…';
      joinClass({...gate.cfg, secret});
      break;
    }

    case 'gate-who': {
      D.myId = document.getElementById('g-who').value;
      gate = null; saveDevice(); render(); break;
    }


    case 'paste':
      sheet = {type:'paste'};
      scrollMemo[view] = window.scrollY; render(); break;

    case 'pastesave': {
      const lines = document.getElementById('p-list').value
        .split('\n').map(x => x.trim()).filter(Boolean);
      if (!lines.length) { toast('Список пуст'); return; }
      const had = active().length;
      if (had && !confirm(`Заменить весь список? Сейчас в нём ${had} ${plural(had,'ученик','ученика','учеников')}.`)) return;
      S.students.forEach((st, i) => {
        const name = lines[i] || '';
        if (st.name !== name) S.collections.forEach(c => delete c.payments[st.id]);
        st.name = name;
      });
      save();
      const put = Math.min(lines.length, SEATS);
      sheet = null; render();
      toast(lines.length > SEATS
        ? `Вписано ${put} из ${lines.length} — мест всего ${SEATS}`
        : `Вписано ${put} ${plural(put,'ученик','ученика','учеников')}`);
      break;
    }

    case 'fresh': {
      if (!confirm('Удалить все демо-примеры — учеников и сборы? Список станет пустым, его нужно будет заполнить.')) return;
      S.collections = [];
      S.students.forEach(st => { st.name = ''; });
      S.payee = {name:'', phone:'', bank:''};
      save(); view = 'roster'; render();
      toast('Чистый лист — заполните список класса');
      break;
    }

    case 'reset':
      if (Cloud.on()){ toast('Сначала отключите общую базу'); return; }
      if (!confirm('Все данные будут заменены демо-примером. Продолжить?')) return;
      S = seed(); save(); view = 'home'; sheet = null; render(); break;
  }
});

/* черновик формы сбора: снимаем значения полей перед перерисовкой */
function readDraft(){
  if (!sheet || sheet.type !== 'edit') return;
  const g = id => document.getElementById(id);
  if (!sheet.draft) return;
  if (g('f-title'))  sheet.draft.title  = g('f-title').value;
  if (g('f-amount')) sheet.draft.amount = g('f-amount').value;
  if (g('f-total'))  sheet.draft.total  = g('f-total').value;
  if (g('f-payers')) sheet.draft.payers = g('f-payers').value;
  if (g('f-days'))   sheet.draft.days   = g('f-days').value;
  if (g('f-start'))  sheet.draft.start  = g('f-start').value;
  if (g('f-note'))   sheet.draft.note   = g('f-note').value;
  if (g('f-pname') || g('f-pphone') || g('f-pbank')) sheet.draft.payee = {
    name:  g('f-pname')  ? g('f-pname').value.trim()  : '',
    phone: g('f-pphone') ? g('f-pphone').value.trim() : '',
    bank:  g('f-pbank')  ? g('f-pbank').value.trim()  : '',
  };
}

/* живой пересчёт предельного срока при вводе */
document.addEventListener('input', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const a = el.dataset.act;

  if (a === 'dlive'){
    readDraft();
    const m = document.getElementById('calc-money');
    const t = document.getElementById('calc-dl');
    if (m) m.innerHTML = moneyCalc(sheet.draft);
    if (t) t.innerHTML = dlCalc(sheet.draft);
    return;
  }
  if (a === 'urlpeek'){
    const box = document.getElementById('url-peek');
    if (!box) return;
    const v = normalizeUrl(el.value);
    if (!el.value.trim()){
      box.innerHTML = 'Можно вставить и адрес из строки браузера, где открыт ваш проект Supabase.';
      box.style.color = '';
    } else if (/^https:\/\/[a-z0-9]+\.supabase\.co$/.test(v)){
      box.innerHTML = `Приложение обратится к <b>${esc(v)}</b> — это верный вид адреса.`;
      box.style.color = 'var(--ok)';
    } else {
      box.innerHTML = `Пока получается <b>${esc(v)}</b> — это не похоже на адрес базы. `
        + 'Нужен вид https://xxxx.supabase.co';
      box.style.color = 'var(--danger)';
    }
    return;
  }
  if (a === 'rename'){
    const s = S.students.find(x => x.id === el.dataset.s);
    s.name = el.value; save(); return;
  }
  if (a === 'clsname'){ S.className = el.value; save();
    const t = document.querySelector('.brand .cls'); if (t) t.textContent = el.value; return; }
  if (a === 'defdays'){ S.defDays = Math.max(1, +el.value || 14); save(); return; }
  if (a.startsWith('pay-')){
    S.payee = {...S.payee, [a.slice(4)]: el.value};
    save(); return;
  }
});

/* ── вход по ссылке от казначея ────────── */
let gate = null;   // {cfg, mode:'code'|'who'}

function parseLink(link){
  const m = String(link).match(/#k=([A-Za-z0-9+/=_-]+)/);
  if (!m) return null;
  try {
    const o = JSON.parse(decodeURIComponent(escape(atob(m[1]))));
    return (o.u && o.k && o.i) ? {url:o.u, key:o.k, id:o.i} : null;
  } catch(e){ return null; }
}

function joinClass(cfg){
  const prev = D.cloud;
  D.cloud = cfg;
  Cloud.pull()
    .then(({state, version, role}) => {
      S = state; Cloud.base = clone(state); Cloud.version = version; Cloud.status = 'ok';
      saveLocal(); saveDevice();
      // казначею выбирать ребёнка незачем — он видит весь список
      gate = role === 'admin' ? null : {cfg, mode:'who'};
      Cloud.start(); render();
      if (role === 'admin') toast('Вход как казначей');
    })
    .catch(e => {
      D.cloud = prev; saveDevice();
      gate = {cfg, mode:'code', msg: e.message || 'Не удалось подключиться'};
      render();
    });
}

/* экран-«калитка»: код класса, затем выбор ребёнка или вход казначея */
function gateView(){
  if (gate.mode === 'code') return `
    <div class="backdrop" style="align-items:center"><div class="sheet" data-stop="1"
      style="border-radius:26px;margin:0 14px;max-width:420px">
      <div class="sheet-hd"><h2>Копилка класса</h2></div>
      <div class="sheet-body">
        <p style="font-size:14px;color:var(--muted);margin-bottom:16px">
          ${gate.msg || 'Вас пригласили в учёт сборов класса. Введите код доступа — его называет казначей.'}</p>
        <div class="field">
          <label>Код доступа</label>
          <input id="g-code" type="password" autocomplete="off" placeholder="код класса или пароль казначея">
          <div class="hint">Казначей вводит здесь свой пароль — приложение само откроет ему
            режим редактирования.</div>
        </div>
        <button class="btn pri wide" style="width:100%;padding:14px" data-act="gate-join">Войти</button>
      </div>
    </div></div>`;

  return `
    <div class="backdrop" style="align-items:center"><div class="sheet" data-stop="1"
      style="border-radius:26px;margin:0 14px;max-width:420px">
      <div class="sheet-hd"><h2>Кто ваш ребёнок?</h2></div>
      <div class="sheet-body">
        <p style="font-size:14px;color:var(--muted);margin-bottom:16px">
          Приложение будет подсвечивать вашу строку и показывать вашу сумму.</p>
        <div class="field">
          <label>Выберите из списка класса</label>
          <select id="g-who">
            ${active().map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('')}
          </select>
        </div>
        <button class="btn pri wide" style="width:100%;padding:14px" data-act="gate-who">Готово</button>
      </div>
    </div></div>`;
}

/* ── запуск ────────────────────────────── */
(function boot(){
  const fromLink = parseLink(location.hash);
  if (fromLink && (!D.cloud || D.cloud.id !== fromLink.id)){
    gate = {cfg: fromLink, mode:'code'};      // пришли по чужой ссылке — спросим код
  } else if (Cloud.on()){
    Cloud.start();
  }
  render();
})();
</script>
</body>
</html>
